<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Moist</title>
  <link href="./style.css" rel="stylesheet" type="text/css" media="all">
  <link href="./images/favicon.ico" rel="icon">
</head>
<body>
  <div id="container">
    <div id="wide_header">
      <header></header>
    </div>
    <div id="flex">
      <div id="left">
        <div id="small_header">
          <header></header>
        </div>
        <aside id="sidebar">
          <h2>Navigation</h2>
          <button id="home_page">Home page</button>
          <br>
          <button id="random_page">Random page</button>
          <br>
          <button id="all_pages">All pages</button>
          <br>
          <input type="text" id="search_query" placeholder="Search..."><button id="search">Go!</button>
          <h2>Theme</h2>
          <select id="theme_select">
            <option>Blue</option>
            <option>Magenta</option>
            <option>Orange</option>
          </select>
        </aside>
      </div>
      <main id="main"></main>
    </div>
  </div>
<script src="./data.js"></script>
<script src="./script.js"></script>
</body>
</html>
